          } else {

        } else {

          qrHtml += ' border-width: 0px; border-style: none;';

async function post(path,body){
  if(!SUPABASE_URL)return {ok:false,status:0};
  try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(SUPABASE_URL.replace(/\/$/,"")+path,{method:"POST",signal:ctl.signal,headers:{"Content-Type":"application/json",apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,Prefer:"return=minimal"},body:JSON.stringify(body)});
    clearTimeout(t);let txt="";if(!r.ok){try{txt=await r.text()}catch(e){}}return {ok:r.ok,status:r.status,text:txt}}catch(e){return {ok:false,status:0,text:String(e)}}
}
const sendSignup=d=>post("/rest/v1/merchants",d);
async function sendTransactionTolerant(base,extras){
  const r=await post("/rest/v1/transactions",{...base,...extras});
  if(r.ok)return r;
  // Si el servidor todavía no tiene las columnas nuevas (no se corrió el SQL nuevo), reintentamos con los campos de siempre.
  if(r.status===400||/column/i.test(r.text||""))return post("/rest/v1/transactions",base);
  return r;
}

${c.tipo}  Serie ${c.serie}  Nº ${pad7(c.numero)}

function cfeIssue(total,iva,client,medio,tx){
  const n=LS.get("cfe_next",1);const sub=Math.round(total*100/(100+IVA[iva].p));const fact=!!(client&&isRut(client.doc));
  const c={tipo:fact?"e-Factura":"e-Ticket",serie:SERIE,numero:n,fecha:now(),emisorRut:EMISOR_RUT,emisorNombre:merchant().name||"(Comercio)",
    receptor:!client?"Consumidor final":fact?`${client.name} · RUT ${client.doc}`:`${client.name} · CI ${client.doc}`,iva,sub,ivaC:total-sub,total,medio,tx};
  LS.set("cfe",LS.get("cfe",[]).concat([c]));LS.set("cfe_next",n+1);return c;
}
async function record(method,code,amount,tx,iva,client,inst=1,brand,type){

  return cfe;

async function authorize(amount,card,inst){

  if(card.brand==="UNKNOWN")return {k:"declined",m:"Marca no aceptada"};

/* ---- Long-press (Admin en Historial, borrar contacto) ---- */
function longPress(el,onLong,onClick){
  let t=null,fired=false,moved=false;
  const start=()=>{fired=false;moved=false;clearTimeout(t);t=setTimeout(()=>{fired=true;if(navigator.vibrate)navigator.vibrate(30);onLong()},700)};
  const cancel=()=>{clearTimeout(t)};
  el.classList.add("nolp");
  el.addEventListener("touchstart",start,{passive:true});
  el.addEventListener("touchmove",()=>{moved=true;cancel()},{passive:true});
  el.addEventListener("touchend",e=>{cancel();if(fired){e.preventDefault()}});
  el.addEventListener("touchcancel",cancel);
  el.addEventListener("mousedown",e=>{if(e.button===0&&!("ontouchstart" in window))start()});
  el.addEventListener("mouseup",cancel);el.addEventListener("mouseleave",cancel);
  el.addEventListener("contextmenu",e=>{e.preventDefault();cancel();if(!fired){fired=true;onLong()}});
  el.addEventListener("click",e=>{if(fired){e.preventDefault();fired=false;return}if(!moved)onClick()});
}

<select id="card"><option value="VISA|DEBIT">Visa débito</option><option value="VISA|CREDIT">Visa crédito</option><option value="MASTERCARD|DEBIT">Mastercard débito</option><option value="MASTERCARD|CREDIT">Mastercard crédito</option><option value="VISA|CREDIT|W">Visa crédito en celular/reloj (billetera móvil)</option><option value="MASTERCARD|DEBIT|W">Mastercard débito en celular/reloj (billetera móvil)</option></select>
<p class="muted">Cuotas (solo crédito)</p><select id="inst">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i?i+1+" cuotas":"1 pago"}</option>`).join("")}</select>
<div class="note">(Cuotas, intereses y cantidad máxima los define el adquirente y el banco emisor — pendiente)</div>
<div class="row"><div><p class="muted">IVA del comprobante</p>${ivaSelect("iva")}</div><div><p class="muted">Cliente</p>${clientSelect("client")}</div></div></div>
<button id="b_charge">Cobrar</button>
<div id="tap">Tocá acá para simular que acercan la tarjeta</div>
<div class="status" id="status"></div>
<div class="note">(Cobro real con iPhone requiere Tap to Pay habilitado por Apple en Uruguay y SDK del proveedor certificado — pendiente)</div>
<p class="methods">Débito y crédito Visa / Mastercard · también celular o reloj (Google Pay / Apple Pay)<br>pagnet.uy@outlook.com</p>`,false);
  waiting=false;
  const status=(t,c)=>{const s=$("#status");s.textContent=t;s.style.color=c};
  $("#b_legal").onclick=()=>go("legal");
  $("#b_pay").onclick=()=>go("payout");
  $("#b_charge").onclick=()=>{
    if(!approved())return status("Tu alta todavía no está aprobada","var(--bad)");
    if(cents($("#amount").value)==null)return status("Ingresá un monto válido","var(--bad)");
    waiting=true;$("#tap").classList.add("wait");status("Acercá la tarjeta al iPhone (simulado: tocá el círculo)","var(--acc)");
  };
  $("#tap").onclick=async()=>{
    if(!waiting)return status("Primero tocá Cobrar","var(--muted)");
    waiting=false;$("#tap").classList.remove("wait");
    const amount=cents($("#amount").value);if(amount==null)return;
    const [brand,type,w]=$("#card").value.split("|");const card={brand,type,wallet:!!w};
    const inst=type==="CREDIT"?+$("#inst").value:1;const iva=$("#iva").value;const client=findContact($("#client").value);
    const wallet=card.wallet?" (billetera móvil)":"";
    status(`Procesando ${brand}${wallet}…`,"#fff");
    const r=await authorize(amount,card,inst);
    if(r.k==="approved"){
      const method=`${brand} ${type}${wallet}`+(inst>1?` ${inst} cuotas`:"");
      const cfe=await record(method,card.wallet?"WALLET":"CARD",amount,r.tx,iva,client,inst,brand,type);
      status(`✔ Aprobado\nCódigo ${r.auth}\n${r.tx}\n${cfeTitle(cfe)}`,"var(--ok)");$("#amount").value="";
      setTimeout(()=>go("cfe",cfeId(cfe)),700);
    }else if(r.k==="declined")status("✖ Rechazado: "+r.m,"var(--bad)");else status("Error: "+r.m,"var(--bad)");
  };
}

function qr(){
  view(`<h1>Cobrar con QR</h1><div class="note">(Cobro QR real requiere adquirente y cumplir el estándar de QR interoperable del BCU — pendiente)</div>
<div class="card light"><p class="amtlbl">Monto de la venta (UYU)</p><input id="qrAmount" placeholder="Monto en pesos (UYU)" inputmode="decimal" autocomplete="off"></div>
<p class="muted">IVA del comprobante</p>${ivaSelect("qiva")}<p class="muted">Cliente (opcional, para e-Factura)</p>${clientSelect("qclient",true)}
<button id="gen">Generar QR</button><div class="banner" id="qlabel" hidden>DEMOSTRACIÓN — no cobra</div><div id="qrBox" hidden></div>
<button id="pay" disabled>Simular que el cliente pagó</button><div class="status" id="qstatus"></div>`);
  let c=0,ref="";
  $("#gen").onclick=()=>{
    const v=cents($("#qrAmount").value);if(v==null)return $("#qstatus").textContent="Ingresá un monto válido";
    c=v;ref="QR-SIM-"+rid();
    // Contenido de demostración, NO es el formato interoperable del BCU.
    const q=qrcode(0,"M");q.addData(`DEMOSTRACION-NO-COBRA|PagNet Pos|UYU ${money(c)}|${ref}`);q.make();
    $("#qrBox").innerHTML=q.createSvgTag({cellSize:6,margin:2,scalable:true});
    $("#qrBox").hidden=false;$("#qlabel").hidden=false;$("#pay").disabled=false;
    $("#qstatus").textContent=`Mostrale el QR al cliente · $ ${money(c)}`;
  };
  $("#pay").onclick=async()=>{
    $("#pay").disabled=true;
    const cfe=await record("QR","QR",c,ref,$("#qiva").value,findContact($("#qclient").value));
    $("#qstatus").textContent=`✔ Cobrado (simulado) · ${ref}\n${cfeTitle(cfe)}`;
    setTimeout(()=>go("cfe",cfeId(cfe)),700);
  };
}

function cfe(id){
  const note=`<div class="note">(Requiere proveedor de facturación electrónica habilitado por DGI, postulación como emisor electrónico y certificado digital — pendiente)</div>`;
  const one=id&&cfeAll().find(c=>cfeId(c)===id);
  if(one){
    view(`${note}<h1>${esc(cfeTitle(one))}</h1><div class="banner" style="font-size:15px">DEMOSTRACIÓN — SIN VALOR FISCAL</div><pre class="mono">${esc(cfeText(one))}</pre><button id="share">Compartir comprobante</button><button class="sec" id="all">Ver todas las facturas</button><div class="status" id="sh"></div>`);
    $("#all").onclick=()=>go("cfe");
    $("#share").onclick=async()=>{
      const text=cfeText(one),title=cfeTitle(one)+" (demostración)";
      if(navigator.share){try{await navigator.share({title,text});return}catch(e){if(e&&e.name==="AbortError")return}}
      try{await navigator.clipboard.writeText(text);$("#sh").textContent="Comprobante copiado al portapapeles"}
      catch(e){const t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();$("#sh").textContent="Comprobante copiado al portapapeles"}
    };
    return;
  }
  const all=cfeAll();
  view(`${note}<h1>Facturas electrónicas (simuladas)</h1>${all.length?all.map(c=>`<button class="sec cf" data-id="${esc(cfeId(c))}">${esc(cfeTitle(c))} · $ ${money(c.total)} · ${esc(c.fecha)}</button>`).join(""):`<p class="muted">Todavía no hay comprobantes. Se genera uno por cada cobro aprobado.</p>`}`);
  app.querySelectorAll(".cf").forEach(b=>b.onclick=()=>go("cfe",b.dataset.id));
}

function contactsScreen(){
  const all=contacts();
  view(`<h1>Clientes y proveedores</h1><p class="warn">Versión de prueba: usá solo datos INVENTADOS. No cargues personas reales.</p>
<div class="note">(Versión real: aviso de privacidad a clientes del comercio y registro en URCDP — pendiente)</div>
<button id="add">+ Agregar</button><p class="muted">Tocá para editar · mantené apretado para borrar</p>
${all.length?all.map(c=>`<button class="sec ct" data-id="${esc(c.id)}" style="text-align:left">${esc(contactLabel(c))}</button>`).join(""):`<p class="muted">No hay contactos todavía.</p>`}`);
  $("#add").onclick=()=>editContact(null);
  app.querySelectorAll(".ct").forEach(b=>{const c=findContact(b.dataset.id);longPress(b,()=>{if(confirm(`¿Borrar ${c.name}?`)){LS.set("contacts",LS.get("contacts",[]).filter(x=>x.id!==c.id));contactsScreen()}},()=>editContact(c))});
}
function editContact(c){
  const m=document.createElement("div");m.className="modal";
  m.innerHTML=`<div><h1>${c?"Editar contacto":"Nuevo contacto"}</h1>
<input id="c_name" placeholder="Nombre (inventado)" value="${esc(c?c.name:"")}"><input id="c_doc" placeholder="RUT (12 dígitos) o CI" inputmode="numeric" value="${esc(c?c.doc:"")}">
<input id="c_phone" placeholder="Teléfono" type="tel" inputmode="tel" value="${esc(c?c.phone:"")}"><input id="c_mail" placeholder="Mail" type="email" inputmode="email" autocapitalize="off" value="${esc(c?c.email:"")}">
<label class="chk"><input type="radio" name="ctype" value="CLIENTE" ${!c||c.type!=="PROVEEDOR"?"checked":""}>Cliente</label><label class="chk"><input type="radio" name="ctype" value="PROVEEDOR" ${c&&c.type==="PROVEEDOR"?"checked":""}>Proveedor</label>
<div class="status" id="c_st"></div><div class="row"><button class="sec" id="c_cancel">Cancelar</button><button id="c_save">Guardar</button></div></div>`;
  document.body.appendChild(m);
  m.querySelector("#c_cancel").onclick=()=>m.remove();
  m.querySelector("#c_save").onclick=()=>{
    const g=id=>m.querySelector(id).value.trim();
    if(!g("#c_name"))return m.querySelector("#c_st").textContent="Falta el nombre";
    const x={id:c?c.id:uuid(),name:g("#c_name"),doc:g("#c_doc"),phone:g("#c_phone"),email:g("#c_mail"),type:m.querySelector("input[name=ctype]:checked").value};
    LS.set("contacts",LS.get("contacts",[]).filter(y=>y.id!==x.id).concat([x]));m.remove();contactsScreen();
  };
}
function history(){const l=LS.get("tx",[]);const tdy=now().slice(0,10),nh=l.filter(x=>String(x).includes(tdy)).length;view(`<h1>Historial de cobros</h1><button class="sec" id="h_pay">💸 Recibir mi plata<br><span class="muted" style="font-size:12px">${esc(payoutSummary())}</span></button><div class="card light"><p class="amtlbl">Resumen de hoy</p><div style="text-align:center;font-size:30px;font-weight:700">${nh} ${nh===1?"cobro":"cobros"}</div><p class="amtlbl" style="text-transform:none;letter-spacing:0">${tdy} · simulación</p></div><pre>${esc(l.length?l.join("\n\n"):"Todavía no hay cobros.")}</pre>`);$("#h_pay").onclick=()=>go("payout")}
function legal(){view(`<h1>Términos y privacidad</h1>${termsHTML()}`)}
function admin(){const p=merchant();view(`<h1>Altas de comercios</h1><div class="note">(En producción vive en el servidor de PagNet, no en el teléfono del comercio)</div><pre>${esc(p.name?`${p.name} · ${p.rubro} · ${p.tipo}\nEstado: ${p.status}\nAceptó: ${p.accepted_at}`:"No hay altas.")}</pre>${p.name?`<div class="note">(Controles pendientes: rubros prohibidos, listas de lavado, verificación de identidad)</div>`:""}`)}

initTabs();go("onboarding");
</script>
